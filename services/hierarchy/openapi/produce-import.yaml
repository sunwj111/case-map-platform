openapi: 3.0.3
info:
  title: Case Map Produce Import API
  version: 0.1.0
  description: 资产生产标准模式的批次与双源导入门禁契约。
servers:
  - url: http://localhost:8787
paths:
  /api/v1/produce/batches:
    post:
      summary: 创建标准模式导入批次
      operationId: createImportBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImportBatchRequest"
      responses:
        "201":
          description: 批次创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatch"
        "400":
          description: 目标或生产模式无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/produce/batches/{batchId}:
    get:
      summary: 查询导入批次及标准模式门禁
      operationId: getImportBatch
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 批次状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatch"
        "404":
          description: 批次不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/produce/batches/{batchId}/cases:
    post:
      summary: 上传并解析历史用例文件
      operationId: importCaseFile
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV、XLSX、XLS 或 XMind
      responses:
        "200":
          description: 用例解析结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseFileParseResult"
        "400":
          description: 文件为空、格式不支持或内容无法解析
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/produce/batches/{batchId}/knowledge:
    post:
      summary: 上传并读取知识库文件
      operationId: importKnowledgeFile
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: TXT、MD、Markdown、XLSX、XLS 或 XMind
      responses:
        "200":
          description: 知识库读取结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeFileParseResult"
        "400":
          description: 文件为空、格式不支持或内容无法解析
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/produce/batches/{batchId}/knowledge/extract:
    post:
      summary: 从已上传知识库中抽取关键字候选
      operationId: extractKnowledgeCandidates
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 场景、功能点、规则和流程节点候选
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeExtractionResult"
        "400":
          description: 尚未上传知识库或内容无法抽取
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/produce/batches/{batchId}/knowledge/text:
    post:
      summary: 粘贴自然语言知识并抽取关键字候选
      operationId: extractPastedKnowledge
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeTextRequest"
      responses:
        "200":
          description: 场景、功能点、规则和流程节点候选
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeExtractionResult"
        "400":
          description: 文本为空或内容无法抽取
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/produce/batches/{batchId}/keywords/confirm:
    post:
      summary: 确认或调整关键字候选
      operationId: confirmKnowledgeCandidates
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmKeywordsRequest"
      responses:
        "200":
          description: 更新后的批次门禁状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatch"
        "400":
          description: 双源导入或关键字抽取尚未完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/produce/batches/{batchId}/draft:
    post:
      summary: 清洗历史用例并生成地图草稿
      operationId: generateMapDraft
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 用例清洗、挂载和知识缺口结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapDraftResult"
        "400":
          description: 标准模式门禁尚未满足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/reviews:
    get:
      summary: 查询评审队列
      operationId: queryReviewQueue
      parameters:
        - name: batchId
          in: query
          schema:
            type: string
        - name: system
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [待评审, 已确认, 已废弃, 已发布]
        - name: kind
          in: query
          schema:
            type: string
            enum: [历史用例, 知识缺口]
        - name: pool
          in: query
          schema:
            type: string
            enum: [A, B, C]
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 评审队列及状态统计
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueueResult"
  /api/v1/reviews/{reviewId}:
    patch:
      summary: 调整待评审用例内容与挂载
      operationId: updateReviewItem
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReviewItemRequest"
      responses:
        "200":
          description: 更新后的评审项
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItem"
  /api/v1/reviews/{reviewId}/confirm:
    post:
      summary: 确认单条评审项
      operationId: confirmReviewItem
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewActionRequest"
      responses:
        "200":
          description: 已确认评审项
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItem"
  /api/v1/reviews/{reviewId}/discard:
    post:
      summary: 废弃单条评审项
      operationId: discardReviewItem
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewActionRequest"
      responses:
        "200":
          description: 已废弃评审项
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItem"
  /api/v1/reviews/batch/confirm:
    post:
      summary: 批量确认评审项并逐条返回失败原因
      operationId: confirmReviewItems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchReviewRequest"
      responses:
        "200":
          description: 批量操作结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchReviewResult"
  /api/v1/reviews/batches/{batchId}/publish:
    post:
      summary: 将批次内已确认用例发布到正式资产库
      operationId: publishReviewedCases
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewActionRequest"
      responses:
        "200":
          description: 正式入库结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishBatchResult"
components:
  schemas:
    CreateImportBatchRequest:
      type: object
      required: [domain, system]
      properties:
        domain:
          type: string
          example: 家装
        system:
          type: string
          example: 报价
        mode:
          type: string
          enum: [standard]
          default: standard
          example: standard
    ImportBatch:
      type: object
      required:
        - id
        - domain
        - system
        - mode
        - status
        - casesRequired
        - knowledgeRequired
        - missingInputs
      properties:
        id:
          type: string
          format: uuid
        domain:
          type: string
        system:
          type: string
        mode:
          type: string
          enum: [standard]
        status:
          type: string
          enum:
            - WAITING_FOR_CASES_AND_KNOWLEDGE
            - WAITING_FOR_CASES
            - WAITING_FOR_KNOWLEDGE
            - READY_FOR_KEYWORD_CALIBRATION
            - READY_FOR_MAP_DRAFT
            - MAP_DRAFT_GENERATED
        casesRequired:
          type: boolean
        knowledgeRequired:
          type: boolean
        casesImported:
          type: boolean
        knowledgeImported:
          type: boolean
        keywordsConfirmed:
          type: boolean
        mapDraftGenerated:
          type: boolean
        reviewQueueGenerated:
          type: boolean
        publishedCount:
          type: integer
        readyForKeywordCalibration:
          type: boolean
        readyForMapDraft:
          type: boolean
        missingInputs:
          type: array
          items:
            type: string
            enum: [cases, knowledge]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        caseImport:
          $ref: "#/components/schemas/CaseFileParseResult"
        knowledgeImport:
          $ref: "#/components/schemas/KnowledgeFileParseResult"
        keywordExtraction:
          $ref: "#/components/schemas/KnowledgeExtractionResult"
        mapDraft:
          $ref: "#/components/schemas/MapDraftResult"
    ImportFileMetadata:
      type: object
      properties:
        fileName:
          type: string
        format:
          type: string
        size:
          type: integer
          format: int64
        sha256:
          type: string
        rowCount:
          type: integer
        sheetName:
          type: string
          nullable: true
        sheetCount:
          type: integer
          nullable: true
    ParsedCaseRow:
      type: object
      properties:
        originalCaseId:
          type: string
        caseName:
          type: string
        step:
          type: string
        expected:
          type: string
        scene:
          type: string
        feature:
          type: string
        module:
          type: string
        sourceRowNumber:
          type: integer
    ImportRisk:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        rowNumber:
          type: integer
          nullable: true
    CaseFileParseResult:
      type: object
      properties:
        metadata:
          $ref: "#/components/schemas/ImportFileMetadata"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ParsedCaseRow"
        risks:
          type: array
          items:
            $ref: "#/components/schemas/ImportRisk"
    KnowledgeFileParseResult:
      type: object
      properties:
        metadata:
          $ref: "#/components/schemas/ImportFileMetadata"
        text:
          type: string
        lineCount:
          type: integer
        risks:
          type: array
          items:
            $ref: "#/components/schemas/ImportRisk"
    KnowledgeTextRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
        sourceName:
          type: string
          default: pasted-knowledge.md
    KeywordCandidate:
      type: object
      properties:
        text:
          type: string
        source:
          type: string
        confidence:
          type: integer
          minimum: 0
          maximum: 100
    KnowledgeExtractionResult:
      type: object
      properties:
        scenes:
          type: array
          items:
            $ref: "#/components/schemas/KeywordCandidate"
        features:
          type: array
          items:
            $ref: "#/components/schemas/KeywordCandidate"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/KeywordCandidate"
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/KeywordCandidate"
        mode:
          type: string
          enum: [nl, structured+nl, confirmed]
        sourceVersion:
          type: string
    ConfirmKeywordsRequest:
      type: object
      properties:
        scenes:
          type: array
          items:
            type: string
        features:
          type: array
          items:
            type: string
        rules:
          type: array
          items:
            type: string
        nodes:
          type: array
          items:
            type: string
    CleanedCaseItem:
      type: object
      properties:
        originalCaseId:
          type: string
        caseName:
          type: string
        scene:
          type: string
        feature:
          type: string
        flowNode:
          type: string
        confidence:
          type: integer
        mountAdvice:
          type: string
          enum: [自动挂载, 待抽检, 人工确认]
        matchEvidence:
          type: array
          items:
            type: string
        sourceRowNumber:
          type: integer
    GapCaseCandidate:
      type: object
      properties:
        id:
          type: string
        scene:
          type: string
        feature:
          type: string
        reason:
          type: string
    MapDraftStats:
      type: object
      properties:
        totalCases:
          type: integer
        autoMounted:
          type: integer
        reviewRequired:
          type: integer
        manualRequired:
          type: integer
        gapCount:
          type: integer
    MapDraftResult:
      type: object
      properties:
        batchId:
          type: string
        cases:
          type: array
          items:
            $ref: "#/components/schemas/CleanedCaseItem"
        gaps:
          type: array
          items:
            $ref: "#/components/schemas/GapCaseCandidate"
        stats:
          $ref: "#/components/schemas/MapDraftStats"
        generatedAt:
          type: string
          format: date-time
    ReviewOperation:
      type: object
      properties:
        action:
          type: string
        operator:
          type: string
        detail:
          type: string
        operatedAt:
          type: string
          format: date-time
    ReviewItem:
      type: object
      properties:
        id:
          type: string
        batchId:
          type: string
        kind:
          type: string
          enum: [历史用例, 知识缺口]
        status:
          type: string
          enum: [待评审, 已确认, 已废弃, 已发布]
        originalCaseId:
          type: string
        officialCaseId:
          type: string
        caseName:
          type: string
        scene:
          type: string
        feature:
          type: string
        flowNode:
          type: string
        step:
          type: string
        expected:
          type: string
        priority:
          type: string
          enum: [P0, P1, P2]
        confidence:
          type: integer
        matchEvidence:
          type: array
          items:
            type: string
        operations:
          type: array
          items:
            $ref: "#/components/schemas/ReviewOperation"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReviewQueueResult:
      type: object
      properties:
        total:
          type: integer
        pending:
          type: integer
        confirmed:
          type: integer
        discarded:
          type: integer
        published:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReviewItem"
    UpdateReviewItemRequest:
      type: object
      properties:
        caseName:
          type: string
        scene:
          type: string
        feature:
          type: string
        flowNode:
          type: string
        step:
          type: string
        expected:
          type: string
        priority:
          type: string
          enum: [P0, P1, P2]
        operator:
          type: string
    ReviewActionRequest:
      type: object
      properties:
        operator:
          type: string
        comment:
          type: string
    BatchReviewRequest:
      type: object
      required: [reviewIds]
      properties:
        reviewIds:
          type: array
          items:
            type: string
        operator:
          type: string
    BatchReviewFailure:
      type: object
      properties:
        reviewId:
          type: string
        reason:
          type: string
    BatchReviewResult:
      type: object
      properties:
        requested:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        succeededIds:
          type: array
          items:
            type: string
        failures:
          type: array
          items:
            $ref: "#/components/schemas/BatchReviewFailure"
    PublishBatchResult:
      type: object
      properties:
        batchId:
          type: string
        publishedCount:
          type: integer
        officialCaseIds:
          type: array
          items:
            type: string
        publishedAt:
          type: string
          format: date-time
    Problem:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
